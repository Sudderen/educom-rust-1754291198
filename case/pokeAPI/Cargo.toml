[package]
name = "pokeAPI"
version = "0.1.0"
edition = "2024"

[dependencies]
mysql = "26.0.1"
rustemon = {version = "4.3.0", features = ["serialize"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-rustls"] }

